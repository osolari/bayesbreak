name: Conda Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniforge-variant: Miniforge3
          python-version: "3.11"

      - name: Install conda-build + anaconda-client
        run: mamba install -y conda-build anaconda-client

      - name: Build conda package
        run: |
          conda config --set anaconda_upload no
          conda build conda-recipe --output-folder conda-bld --channel conda-forge

      - name: Upload to Anaconda.org
        if: env.ANACONDA_TOKEN != ''
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_USER: ${{ secrets.ANACONDA_USER }}
        run: |
          anaconda -t "$ANACONDA_TOKEN" upload \
            conda-bld/**/bayesbreak-*.tar.bz2 \
            --user "$ANACONDA_USER" --label main --skip-existing
