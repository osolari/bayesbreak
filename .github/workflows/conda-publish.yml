name: Conda Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-variant: Mambaforge
          python-version: '3.9'

      - name: Install conda-build and anaconda-client
        run: |
          mamba install -y conda-build anaconda-client

      - name: Build Conda package
        run: |
          conda config --set anaconda_upload no
          conda build . --output-folder conda-bld

      - name: Upload to Anaconda.org
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda login --token $ANACONDA_TOKEN
          anaconda upload conda-bld/**/bayesbreak-*.tar.bz2 --user <your-anaconda-username> --label main --skip-existing
