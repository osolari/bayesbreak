site_name: BayesBreak
site_description: Exact Bayesian segmentation with a scikit-learn compatible API.
repo_url: https://github.com/osolari/bayesbreak
repo_name: osolari/bayesbreak

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Model families: models.md
  - API reference: api.md
  - Math notes: math.md
  - Real-data loaders: datasets.md
  - Reproducibility: reproducibility.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
