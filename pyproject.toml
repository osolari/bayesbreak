[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesbreak"
dynamic = ["version"]
description = "Generalized hierarchical Bayesian segmentation with exact conjugate and approximate nonconjugate inference"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [{ name = "Omid Shams Solari", email = "omid.solari@saimai.com" }]
maintainers = [{ name = "Omid Shams Solari", email = "omid.solari@saimai.com" }]

keywords = [
    "bayesian",
    "segmentation",
    "change-point",
    "piecewise-constant",
    "dynamic-programming",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.6",
    "seaborn>=0.12",
]
datasets = [
    "pooch>=1.7",
    "pandas>=2.0",
    "rdata>=0.11",
    "requests>=2.31",
]
datasets-live = [
    "yfinance>=0.2",
]
# Frequentist changepoint baselines (PELT, optimal partitioning, BS, WBS)
# via the upstream ``ruptures`` library (Truong et al. 2018).
baselines = [
    "ruptures>=1.1",
]
# Bioconductor-backed baselines (currently: CBS via ``DNAcopy``).
# Requires both ``rpy2`` and an R install with ``DNAcopy`` from Bioconductor.
baselines-r = [
    "rpy2>=3.5",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "nbstripout>=0.7",
    "codespell>=2.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
    "pymdown-extensions>=10.0",
]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
    "nbconvert>=7.16",
    "nbformat>=5.9",
    "matplotlib>=3.6",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/osolari/bayesbreak"
Documentation = "https://osolari.github.io/bayesbreak"
Repository = "https://github.com/osolari/bayesbreak"
Issues = "https://github.com/osolari/bayesbreak/issues"
Report = "https://github.com/osolari/bayesbreak/blob/main/report/releases/phase6/BayesBreak_Final_Main_Journal_Paper.pdf"

[project.scripts]
bayesbreak = "bayesbreak.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["bayesbreak*"]

[tool.setuptools.package-data]
bayesbreak = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "bayesbreak._version.__version__" }

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q --cov=src/bayesbreak --cov-report=term-missing"
markers = [
    "slow: tests that take non-trivial time (deselect with -m 'not slow')",
    "network: tests that reach out to the internet",
]

[tool.coverage.run]
source = ["src/bayesbreak"]
omit = [
    "src/bayesbreak/_version.py",
    "src/bayesbreak/datasets/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
strict_optional = true
warn_unused_configs = true
ignore_missing_imports = true
# Numpy 2.x types are aggressive about `generic[Any]` vs concrete scalar
# types when callers pass ``np.ndarray`` slices into ``float(...)``. The
# generated stubs catch some real bugs but produce a lot of noise on
# scientific code; we therefore allow the implicit cast.
disable_error_code = ["arg-type", "index", "union-attr", "type-var", "assignment", "operator"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "src/bayesbreak/_version.py",
    "report/**",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["bayesbreak"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.codespell]
skip = "*.bib,*.bst,*.cls,*.sty,*.tex,*.ipynb,*.pdf,*.png,*.zip,report/**,scripts/**/results/*"
# CNA = Copy Number Array (DNAcopy::CNA class); not a typo.
ignore-words-list = "cna"
