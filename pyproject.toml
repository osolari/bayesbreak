[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesbreak"
dynamic = ["version"]
description = "Bayesian Piecewise Constant Regression — exact Bayesian segmentation following Hutter (2006)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [
    { name = "Omid Shams", email = "omid@example.com" }
]
maintainers = [
    { name = "Omid Shams", email = "omid@example.com" }
]

keywords = ["bayesian", "segmentation", "regression", "piecewise", "variational", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "black>=23.0",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.4",
    "mkdocs-material>=9.0",
]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=3.0",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/omidshams/bayesbreak"
Documentation = "https://omidshams.github.io/bayesbreak"
Repository = "https://github.com/omidshams/bayesbreak"
Issues = "https://github.com/omidshams/bayesbreak/issues"

# Optional console entry point
[project.scripts]
bayesbreak = "bayesbreak.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
packages = ["bayesbreak"]

[tool.setuptools.package-data]
bayesbreak = ["py.typed"]

[tool.setuptools_scm]
write_to = "src/bayesbreak/_version.py"
fallback_version = "0.0.1.dev0"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=src/bayesbreak --cov-report=term-missing"

[tool.coverage.run]
source = ["src/bayesbreak"]
omit = ["src/bayesbreak/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = false
strict_optional = true
warn_unused_ignores = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["bayesbreak"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
