[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesbreak"
dynamic = ["version"]
description = "Exact Bayesian segmentation: block evidence + dynamic programming, scikit-learn compatible"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [{ name = "Omid Shams Solari", email = "omid.solari@saimai.com" }]
maintainers = [{ name = "Omid Shams Solari", email = "omid.solari@saimai.com" }]

keywords = [
    "bayesian",
    "segmentation",
    "change-point",
    "piecewise-constant",
    "dynamic-programming",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.6",
    "seaborn>=0.12",
]
datasets = [
    "pooch>=1.7",
    "pandas>=2.0",
]
datasets-live = [
    "yfinance>=0.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "nbstripout>=0.7",
    "codespell>=2.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
]

[project.urls]
Homepage = "https://github.com/osolari/bayesbreak"
Documentation = "https://osolari.github.io/bayesbreak"
Repository = "https://github.com/osolari/bayesbreak"
Issues = "https://github.com/osolari/bayesbreak/issues"
Report = "https://github.com/osolari/bayesbreak/blob/master/docs/report/bayesbreak.pdf"

[project.scripts]
bayesbreak = "bayesbreak.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["bayesbreak*"]

[tool.setuptools.package-data]
bayesbreak = ["py.typed"]

[tool.setuptools_scm]
write_to = "src/bayesbreak/_version.py"
fallback_version = "1.0.0.dev0"

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q --cov=src/bayesbreak --cov-report=term-missing"
markers = [
    "slow: tests that take non-trivial time (deselect with -m 'not slow')",
    "network: tests that reach out to the internet",
]

[tool.coverage.run]
source = ["src/bayesbreak"]
omit = [
    "src/bayesbreak/_version.py",
    "src/bayesbreak/datasets/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
strict_optional = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "src/bayesbreak/_version.py",
    "docs/report/**",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["bayesbreak"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.codespell]
skip = "*.bib,*.bst,*.cls,*.sty,*.tex,*.ipynb,*.pdf,*.png,*.zip,docs/report/*,scripts/**/results/*"
